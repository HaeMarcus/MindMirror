<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MindMirror 核心体验</title>
  <desc id="desc">从导入个人数据、解析与语义索引到结构化洞察、证据来源、大五人格画像与持续更新的产品流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#344238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#84937a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f39a45"/>
    </marker>
    <style>
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #344238; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #71806d; }
      .node-title { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #344238; text-anchor: middle; }
      .node-note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #71806d; text-anchor: middle; }
      .line { fill: none; stroke: #84937a; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .accent-line { fill: none; stroke: #f39a45; stroke-width: 2.2; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#f7faf5"/>
  <rect x="28" y="26" width="1144" height="378" rx="28" fill="#ffffff" stroke="#dce6d8" stroke-width="1.5"/>
  <text x="64" y="78" class="title">核心体验</text>
  <text x="64" y="108" class="subtitle">让分散的个人数据，逐步转化为可追溯、会持续更新的自我认知</text>

  <path class="line" d="M 216 197 L 264 197"/>
  <path class="line" d="M 430 197 L 478 197"/>
  <path class="line" d="M 620 197 L 668 197"/>
  <path class="line" d="M 842 197 C 884 197 884 157 920 157"/>
  <path class="accent-line" d="M 842 197 C 884 197 884 275 920 275"/>
  <path class="line" d="M 1012 202 L 1012 230"/>
  <path class="accent-line" d="M 920 275 C 875 275 875 338 822 338 L 760 338"/>

  <g>
    <rect x="64" y="154" width="152" height="86" rx="17" fill="#ffffff" stroke="#b8c6b2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="140" y="190" class="node-title">导入个人数据</text>
    <text x="140" y="215" class="node-note">日记 · 复盘 · 账单</text>
  </g>

  <g>
    <rect x="264" y="154" width="166" height="86" rx="17" fill="#eef4ea" stroke="#b8c6b2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="347" y="190" class="node-title">解析与语义索引</text>
    <text x="347" y="215" class="node-note">建立可检索知识片段</text>
  </g>

  <g>
    <rect x="478" y="154" width="142" height="86" rx="17" fill="#ffffff" stroke="#b8c6b2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="549" y="190" class="node-title">开始对话</text>
    <text x="549" y="215" class="node-note">从真实问题出发</text>
  </g>

  <g>
    <rect x="668" y="154" width="174" height="86" rx="17" fill="#eef4ea" stroke="#b8c6b2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="755" y="190" class="node-title">结构化洞察</text>
    <text x="755" y="215" class="node-note">结论 · 模式 · 证据</text>
  </g>

  <g>
    <rect x="920" y="114" width="184" height="86" rx="17" fill="#ffffff" stroke="#b8c6b2" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1012" y="150" class="node-title">查看证据来源</text>
    <text x="1012" y="175" class="node-note">回溯文件与原始片段</text>
  </g>

  <g>
    <rect x="920" y="232" width="184" height="86" rx="17" fill="#fff7ed" stroke="#f2bd87" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1012" y="268" class="node-title">大五人格画像</text>
    <text x="1012" y="293" class="node-note">随证据逐步校准</text>
  </g>

  <g>
    <rect x="564" y="301" width="196" height="74" rx="37" fill="#fff7ed" stroke="#f2bd87" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="662" y="333" class="node-title">准确度反馈</text>
    <text x="662" y="357" class="node-note">推动下一轮持续更新</text>
  </g>
</svg>
