<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">MindMirror 从上传到洞察的数据流程</title>
  <desc id="desc">用户上传数据后，FastAPI 完成解析、向量化、检索和画像预分析，并通过 Claude Sonnet 返回结构化洞察。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#75866d" />
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e9983f" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#52604e" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1200" height="690" fill="#f7faf5" />
  <rect x="28" y="28" width="1144" height="634" rx="22" fill="#fbfcfa" stroke="#dce5d8" />

  <text x="62" y="77" fill="#344238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700">从上传到洞察</text>
  <text x="62" y="108" fill="#7b8878" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">多源数据解析、用户级隔离、画像预分析与证据型回答</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="65" y="138" width="150" height="56" rx="14" fill="#ffffff" stroke="#9aaa91" stroke-width="1.5" />
      <rect x="295" y="138" width="150" height="56" rx="14" fill="#eef4ea" stroke="#8a9a7e" stroke-width="1.5" />
      <rect x="525" y="138" width="150" height="56" rx="14" fill="#ffffff" stroke="#9aaa91" stroke-width="1.5" />
      <rect x="755" y="138" width="150" height="56" rx="14" fill="#fff7ed" stroke="#e7ad69" stroke-width="1.5" />
      <rect x="985" y="138" width="150" height="56" rx="14" fill="#ffffff" stroke="#9aaa91" stroke-width="1.5" />
    </g>
    <text x="140" y="172" fill="#344238" font-weight="600">用户</text>
    <text x="370" y="172" fill="#344238" font-weight="600">FastAPI</text>
    <text x="600" y="172" fill="#344238" font-weight="600">SQLite + FAISS</text>
    <text x="830" y="172" fill="#80552e" font-weight="600">画像预分析</text>
    <text x="1060" y="172" fill="#344238" font-weight="600">Claude Sonnet</text>
  </g>

  <g stroke="#c8d2c4" stroke-width="1.4" stroke-dasharray="5 7">
    <line x1="140" y1="194" x2="140" y2="625" />
    <line x1="370" y1="194" x2="370" y2="625" />
    <line x1="600" y1="194" x2="600" y2="625" />
    <line x1="830" y1="194" x2="830" y2="625" />
    <line x1="1060" y1="194" x2="1060" y2="625" />
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#536253">
    <line x1="140" y1="238" x2="365" y2="238" stroke="#75866d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="252" y="225" text-anchor="middle">上传 HTML / MD / CSV</text>

    <line x1="370" y1="294" x2="595" y2="294" stroke="#75866d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="482" y="281" text-anchor="middle">解析、向量化与用户隔离存储</text>

    <line x1="370" y1="350" x2="825" y2="350" stroke="#e9983f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-accent)" />
    <text x="598" y="337" text-anchor="middle" fill="#99602d">合并调度后台画像分析</text>

    <line x1="140" y1="410" x2="365" y2="410" stroke="#75866d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="252" y="397" text-anchor="middle">发起问题</text>

    <line x1="370" y1="466" x2="595" y2="466" stroke="#75866d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="482" y="453" text-anchor="middle">多源检索与来源感知排序</text>

    <line x1="370" y1="522" x2="1055" y2="522" stroke="#75866d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="712" y="509" text-anchor="middle">问题 + 记忆 + 压缩证据</text>

    <line x1="1060" y1="578" x2="145" y2="578" stroke="#e9983f" stroke-width="2.2" marker-end="url(#arrow-accent)" />
    <rect x="470" y="556" width="260" height="30" rx="15" fill="#fff7ed" stroke="#f0c28e" />
    <text x="600" y="576" text-anchor="middle" fill="#80552e" font-weight="600">SSE 结构化流式回答</text>

    <line x1="370" y1="625" x2="145" y2="625" stroke="#75866d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <text x="257" y="612" text-anchor="middle">首轮回答后激活初步画像</text>
  </g>
</svg>
